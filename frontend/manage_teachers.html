<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Teachers — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="adminName">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="admin_dashboard.html">&larr; Main menu</a>
  </div>

  <div class="container text-center mb-4">
    <div class="card d-inline-block p-3 px-4">
      <div class="fs-5">Teachers</div>
      <div class="fs-4" id="teacherCount">—</div>
    </div>
  </div>

  <div class="container">
    <div id="formAlert" class="alert alert-danger" style="display: none;"></div>
    <div id="successAlert" class="alert alert-success" style="display: none;"></div>

    <table class="table table-bordered align-middle" id="teacherTable">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>ID number</th>
          <th>Mobile number</th>
          <th>Classes taught</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="teacherBody">
        <tr><td colspan="5" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>

    <div class="d-flex gap-2 mb-4">
      <a href="create_teacher.html" class="btn btn-primary">Create account</a>
    </div>
  </div>

  <script>
    const API_BASE = 'https://brightpath-backend-bagrbffzgjchfvek.malaysiawest-01.azurewebsites.net';
    const STATUS_OPTIONS = ['ACTIVE', 'INACTIVE'];
    let teachersData = [];

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    function showFormAlert(message) {
      const alertEl = document.getElementById('formAlert');
      alertEl.textContent = message;
      alertEl.style.display = '';
    }

    function hideAlerts() {
      document.getElementById('formAlert').style.display = 'none';
      document.getElementById('successAlert').style.display = 'none';
    }

    async function loadTeachers() {
      const teacherBody = document.getElementById('teacherBody');
      try {
        const [teachers, courses] = await Promise.all([
          apiGet('/api/v1/teachers'),
          apiGet('/api/v1/auth/courses'),
        ]);

        teachersData = teachers;
        document.getElementById('teacherCount').textContent = teachers.length;

        const classesByTeacher = {};
        courses.forEach(c => {
          if (!classesByTeacher[c.teacher_id_bus]) classesByTeacher[c.teacher_id_bus] = [];
          classesByTeacher[c.teacher_id_bus].push(c.course_name);
        });

        if (teachers.length === 0) {
          teacherBody.innerHTML = '<tr><td colspan="5" class="text-muted">No teachers yet.</td></tr>';
          return;
        }

        teacherBody.innerHTML = teachers.map(t => {
          const classes = classesByTeacher[t.teacher_id_bus] || [];
          const statusOptions = STATUS_OPTIONS.map(s =>
            `<option value="${s}" ${s === t.status ? 'selected' : ''}>${s}</option>`
          ).join('');

          return `<tr>
            <td>${esc(t.salutation)} ${esc(t.first_name)} ${esc(t.last_name)}</td>
            <td>${esc(t.teacher_id_bus)}</td>
            <td>${esc(t.mobile) || '—'}</td>
            <td>${classes.length ? classes.map(esc).join(', ') : '<span class="text-muted">None</span>'}</td>
            <td>
              <div class="d-flex gap-1">
                <select class="form-select form-select-sm" style="width: auto;" data-teacher="${esc(t.teacher_id_bus)}">
                  ${statusOptions}
                </select>
                <button class="btn btn-sm btn-outline-primary" data-teacher="${esc(t.teacher_id_bus)}" onclick="updateStatus(this)">Save</button>
              </div>
            </td>
          </tr>`;
        }).join('');
      } catch (err) {
        teacherBody.innerHTML = '<tr><td colspan="5" class="text-danger">Could not load teachers. Please refresh.</td></tr>';
        console.error('Failed to load teachers:', err);
      }
    }

    async function updateStatus(button) {
      hideAlerts();
      const teacherId = button.getAttribute('data-teacher');
      const select = document.querySelector(`select[data-teacher="${CSS.escape(teacherId)}"]`);
      const newStatus = select.value;
      const teacher = teachersData.find(t => t.teacher_id_bus === teacherId);

      button.disabled = true;
      button.textContent = 'Saving...';

      try {
        // Backend requires salutation + mobile + status together on every PATCH —
        // salutation and mobile are resent unchanged since only status is editable here.
        const response = await fetch(`${API_BASE}/api/v1/teacher/${encodeURIComponent(teacherId)}`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ salutation: teacher.salutation, mobile: teacher.mobile, status: newStatus }),
        });

        const body = await response.json().catch(() => ({}));

        if (!response.ok) {
          if (body.details) {
            const messages = Object.values(body.details);
            showFormAlert(messages.join(' | '));
          } else {
            showFormAlert(body.message || `Status update failed (${response.status}).`);
          }
          return;
        }

        teacher.status = newStatus;
        const successAlert = document.getElementById('successAlert');
        successAlert.textContent = `${teacher.first_name} ${teacher.last_name}'s status updated to ${newStatus}.`;
        successAlert.style.display = '';
      } catch (err) {
        showFormAlert('Network error — could not reach the server. Please try again.');
        console.error('Status update failed:', err);
      } finally {
        button.disabled = false;
        button.textContent = 'Save';
      }
    }

    async function init() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }
      if (me.user.role !== 'ADMIN') {
        window.location.href = 'login.html';
        return;
      }
      const admin = me.admin || {};
      document.getElementById('adminName').textContent =
        `${admin.first_name || ''} ${admin.last_name || ''}`.trim() || me.user.email;

      await loadTeachers();
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>

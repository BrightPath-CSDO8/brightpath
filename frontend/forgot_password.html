<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 340px;">
      <h4 class="mb-1">Forgot Password</h4>
      <p class="text-muted small mb-3">
        Enter the email address associated with your account. We'll send you a link to reset your password.
      </p>

      <!-- TODO (Week 8): wire to the password-reset-request endpoint (generates a time-limited token, emails the link) -->
      <form>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" placeholder="name@example.com">
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary flex-fill">Send reset link</button>
          <a href="login.html" class="btn btn-outline-secondary flex-fill">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Courses — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="adminName">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="admin_dashboard.html">&larr; Main menu</a>
  </div>

  <div class="container">
    <div class="row text-center g-3 mb-4" style="max-width: 250px;">
      <div class="col">
        <div class="card p-3"><div class="text-muted small">Courses</div><div class="fs-4" id="courseCount">—</div></div>
      </div>
    </div>

    <h4 class="mb-3">Manage Courses</h4>

    <div id="formAlert" class="alert alert-danger" style="display: none;"></div>
    <div id="successAlert" class="alert alert-success" style="display: none;"></div>

    <table class="table table-bordered align-middle" id="courseTable">
      <thead class="table-light">
        <tr>
          <th>Course name</th>
          <th>Teacher</th>
          <th>Room</th>
          <th>Schedule</th>
          <th>Starts</th>
          <th>Ends</th>
          <th>Enrolled</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="courseBody">
        <tr><td colspan="8" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>

    <a href="create_course.html" class="btn btn-primary mb-4">Create course</a>
  </div>

  <script>
    const API_BASE = 'https://brightpath-backend-bagrbffzgjchfvek.malaysiawest-01.azurewebsites.net';
    const STATUS_OPTIONS = ['OPEN', 'CLOSED', 'INACTIVE', 'PENDING'];

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    function showFormAlert(message) {
      const alertEl = document.getElementById('formAlert');
      alertEl.textContent = message;
      alertEl.style.display = '';
    }

    function hideAlerts() {
      document.getElementById('formAlert').style.display = 'none';
      document.getElementById('successAlert').style.display = 'none';
    }

    async function loadCourses() {
      const courseBody = document.getElementById('courseBody');
      try {
        const [courses, teachers, classrooms, enrolments] = await Promise.all([
          apiGet('/api/v1/auth/courses'),
          apiGet('/api/v1/teachers'),
          apiGet('/api/v1/classrooms'),
          apiGet('/api/v1/auth/enrolments'),
        ]);

        document.getElementById('courseCount').textContent = courses.length;

        const teacherMap = Object.fromEntries(teachers.map(t => [t.teacher_id_bus, t]));
        const classroomMap = Object.fromEntries(classrooms.map(c => [c.classroom_id, c]));

        const enrolledCounts = {};
        enrolments.forEach(e => {
          if (e.status === 'CONFIRMED') {
            enrolledCounts[e.course_id_bus] = (enrolledCounts[e.course_id_bus] || 0) + 1;
          }
        });

        if (courses.length === 0) {
          courseBody.innerHTML = '<tr><td colspan="8" class="text-muted">No courses yet.</td></tr>';
          return;
        }

        courseBody.innerHTML = courses.map(c => {
          const teacher = teacherMap[c.teacher_id_bus];
          const teacherName = teacher ? `${teacher.salutation} ${teacher.last_name}` : '—';
          const classroom = classroomMap[c.classroom_id];
          const roomName = classroom ? classroom.room_name : '—';
          const enrolledCount = enrolledCounts[c.course_id_bus] || 0;

          const statusOptions = STATUS_OPTIONS.map(s =>
            `<option value="${s}" ${s === c.status ? 'selected' : ''}>${s}</option>`
          ).join('');

          return `<tr>
            <td>${esc(c.course_name)}</td>
            <td>${esc(teacherName)}</td>
            <td>${esc(roomName)}</td>
            <td>${esc(c.schedule)}</td>
            <td>${formatDate(c.start_date)}</td>
            <td>${formatDate(c.end_date)}</td>
            <td>${enrolledCount} / ${esc(c.capacity)}</td>
            <td>
              <div class="d-flex gap-1">
                <select class="form-select form-select-sm" style="width: auto;" data-course="${esc(c.course_id_bus)}">
                  ${statusOptions}
                </select>
                <button class="btn btn-sm btn-outline-primary" data-course="${esc(c.course_id_bus)}" onclick="updateStatus(this)">Save</button>
              </div>
            </td>
          </tr>`;
        }).join('');
      } catch (err) {
        courseBody.innerHTML = '<tr><td colspan="8" class="text-danger">Could not load courses. Please refresh.</td></tr>';
        console.error('Failed to load courses:', err);
      }
    }

    async function updateStatus(button) {
      hideAlerts();
      const courseId = button.getAttribute('data-course');
      const select = document.querySelector(`select[data-course="${CSS.escape(courseId)}"]`);
      const newStatus = select.value;

      button.disabled = true;
      button.textContent = 'Saving...';

      try {
        const response = await fetch(`${API_BASE}/api/v1/courses/${encodeURIComponent(courseId)}`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus }),
        });

        const body = await response.json().catch(() => ({}));

        if (!response.ok) {
          if (body.details) {
            const messages = Object.entries(body.details).map(([field, msg]) => `${field}: ${msg}`);
            showFormAlert(messages.join(' | '));
          } else {
            showFormAlert(body.message || `Status update failed (${response.status}).`);
          }
          return;
        }

        const successAlert = document.getElementById('successAlert');
        successAlert.textContent = `Course status updated to ${newStatus}.`;
        successAlert.style.display = '';
      } catch (err) {
        showFormAlert('Network error — could not reach the server. Please try again.');
        console.error('Status update failed:', err);
      } finally {
        button.disabled = false;
        button.textContent = 'Save';
      }
    }

    async function init() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }
      if (me.user.role !== 'ADMIN') {
        window.location.href = 'login.html';
        return;
      }
      const admin = me.admin || {};
      document.getElementById('adminName').textContent =
        `${admin.first_name || ''} ${admin.last_name || ''}`.trim() || me.user.email;

      await loadCourses();
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>

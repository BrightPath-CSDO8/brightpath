<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <title>Administrator Dashboard — BrightPath</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 d-flex align-items-center text-decoration-none" href="admin_dashboard.html">
      <img src="assets/logo.png" alt="" height="34" class="me-2">
      <span class="fw-semibold">BrightPath</span>
    </a>
    <span class="text-muted">
      <span id="adminName">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="view_admin.html?admin=me">My Profile</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-4">

    <div class="row text-center g-3 mb-2">
      <div class="col">
        <div class="card p-3">
          <div class="fs-5">Courses</div>
          <div class="fs-4" id="courseCount">—</div>
        </div>
        <a href="manage_courses.html" class="d-block mt-2">Manage courses</a>
      </div>
      <div class="col">
        <div class="card p-3">
          <div class="fs-5">Enrolments</div>
          <div class="fs-4" id="enrolmentCount">—</div>
        </div>
        <a href="manage_enrolments.html" class="d-block mt-2">Manage enrolments</a>
      </div>
      <div class="col">
        <div class="card p-3">
          <div class="fs-5">Students</div>
          <div class="fs-4" id="studentCount">—</div>
        </div>
        <a href="manage_students.html" class="d-block mt-2">Manage students</a>
      </div>
      <div class="col">
        <div class="card p-3">
          <div class="fs-5">Teachers</div>
          <div class="fs-4" id="teacherCount">—</div>
        </div>
        <a href="manage_teachers.html" class="d-block mt-2">Manage teachers</a>
      </div>
      <div class="col">
        <div class="card p-3">
          <div class="fs-5">Admins</div>
          <div class="fs-4" id="adminCount">—</div>
        </div>
        <a href="manage_admins.html" class="d-block mt-2">Manage admins</a>
      </div>
    </div>

    <a href="enrolment_summary_report.html" class="btn btn-outline-secondary mt-3">Enrolment report</a>

  </div>

  <script src="config.js"></script>
  <script>

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    async function loadDashboard() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }
      if (me.user.role !== 'ADMIN') {
        window.location.href = 'login.html';
        return;
      }

      const admin = me.admin || {};
      document.getElementById('adminName').textContent =
        `${admin.first_name || ''} ${admin.last_name || ''}`.trim() || me.user.email;

      const counters = [
        ['/api/v1/auth/courses', 'courseCount'],
        ['/api/v1/auth/enrolments', 'enrolmentCount'],
        ['/api/v1/students', 'studentCount'],
        ['/api/v1/teachers', 'teacherCount'],
        ['/api/v1/admins', 'adminCount'],
      ];

      await Promise.all(counters.map(async ([path, elementId]) => {
        try {
          const data = await apiGet(path);
          document.getElementById(elementId).textContent = data.length;
        } catch (err) {
          document.getElementById(elementId).textContent = '!';
          console.error(`Failed to load ${path}:`, err);
        }
      }));
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    loadDashboard();
  </script>
</body>
</html>

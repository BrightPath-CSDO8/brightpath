<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <title>Student Dashboard — BrightPath</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>@media (max-width: 576px) { .table-responsive > .table { min-width: 720px; } }
    @media (max-width: 991px) { #nextLesson { order: 3; width: 100%; text-align: center; margin-top: .25rem; } }</style>
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 d-flex align-items-center text-decoration-none" href="student_dashboard.html">
      <img src="assets/logo.png" alt="" height="34" class="me-2">
      <span class="fw-semibold">BrightPath</span>
    </a>
    <span id="nextLesson" class="fw-medium text-success"></span>
    <span class="text-muted">
      <span id="studentName">Loading...</span> (Student) &nbsp;|&nbsp; <a href="student_profile.html">My Profile</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-4">

    <div class="card mb-4">
      <div class="card-header">My courses &amp; schedule</div>
      <div class="table-responsive"><table class="table mb-0" style="table-layout: fixed; width: 100%;">
        <thead><tr>
          <th style="width: 22%;">Course</th>
          <th style="width: 18%;">Teacher</th>
          <th style="width: 14%;">Room</th>
          <th style="width: 26%;">Schedule</th>
          <th style="width: 20%;">Status</th>
        </tr></thead>
        <tbody id="coursesBody">
          <tr><td colspan="5" class="text-muted">Loading...</td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="card mb-4">
      <div class="card-header">Grades and feedback</div>
      <div class="table-responsive"><table class="table mb-0" style="table-layout: fixed; width: 100%;">
        <thead><tr>
          <th style="width: 22%;">Course</th>
          <th style="width: 20%;">Assessment</th>
          <th style="width: 10%;">Score</th>
          <th style="width: 33%;">Feedback</th>
          <th style="width: 15%;">Date</th>
        </tr></thead>
        <tbody id="gradesBody">
          <tr><td colspan="5" class="text-muted">Loading...</td></tr>
        </tbody>
      </table></div>
    </div>

    <div class="card mb-4">
      <div class="card-header">My attendance</div>
      <div class="table-responsive"><table class="table mb-0" style="table-layout: fixed; width: 100%;">
        <thead><tr>
          <th style="width: 25%;">Date</th>
          <th style="width: 25%;">Course</th>
          <th style="width: 25%;">Status</th>
          <th style="width: 25%;">Marked by</th>
        </tr></thead>
        <tbody id="attendanceBody">
          <tr><td colspan="4" class="text-muted">Loading...</td></tr>
        </tbody>
      </table></div>
    </div>

    <a href="browse_courses.html" class="btn btn-primary">Enrol in a course</a>

  </div>

  <script src="config.js"></script>
  <script>

    const ATTENDANCE_BADGE = {
      PRESENT: 'bg-success',
      LATE: 'bg-warning text-dark',
      ABSENT: 'bg-danger',
    };

    // Escape text before inserting it as HTML, so free-text fields
    // (e.g. grade feedback typed by a teacher) can't inject markup or scripts.
    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    // ---- Upcoming lesson (worked out from each course's free-text schedule) ----
    const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    let lessonSources = [];

    // Understands schedules like "Monday 9am - 11am", "Every Monday 11am-12pm", "Wed 7pm - 9pm".
    function parseSchedule(text) {
      const s = String(text || '').toLowerCase();
      const dayMatch = s.match(/\b(sun|mon|tue|wed|thu|fri|sat)[a-z]*/);
      if (!dayMatch) return null;
      const times = [...s.matchAll(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/g)];
      if (times.length < 2) return null;
      const toMinutes = m => ((Number(m[1]) % 12) + (m[3] === 'pm' ? 12 : 0)) * 60 + Number(m[2] || 0);
      return {
        day: ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].indexOf(dayMatch[1]),
        start: toMinutes(times[0]),
        end: toMinutes(times[1]),
      };
    }

    function formatClock(minutes) {
      const h24 = Math.floor(minutes / 60), m = minutes % 60;
      const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
      return `${h12}${m ? ':' + String(m).padStart(2, '0') : ''}${h24 >= 12 ? 'pm' : 'am'}`;
    }

    function dateOnly(iso) {
      const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    // Returns { name, date, start, end, inProgress } for the soonest lesson still to come, or null.
    function computeNextLesson(items, now) {
      let best = null;
      items.forEach(item => {
        const sched = parseSchedule(item.schedule);
        if (!sched || !item.start_date || !item.end_date) return;
        const first = dateOnly(item.start_date), last = dateOnly(item.end_date);
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        for (let i = 0; i <= 400; i++) {
          const day = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
          if (day > last) break;
          if (day < first || day.getDay() !== sched.day) continue;
          const startAt = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, sched.start);
          const endAt = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 0, sched.end);
          if (endAt <= now) continue;
          if (!best || startAt < best.startAt) {
            best = { name: item.course_name, date: day, start: sched.start, end: sched.end, startAt, inProgress: startAt <= now };
          }
          break;
        }
      });
      return best;
    }

    function updateNextLesson() {
      const el = document.getElementById('nextLesson');
      const next = computeNextLesson(lessonSources, new Date());
      if (!next) { el.textContent = ''; return; }
      const dateText = next.date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
      el.textContent = `${next.inProgress ? 'Happening now' : 'Upcoming lesson'}: ${next.name}, ${WEEKDAYS[next.date.getDay()]} (${dateText}), ${formatClock(next.start)} - ${formatClock(next.end)}`;
    }

    setInterval(updateNextLesson, 60000);

    async function loadCourses() {
      const coursesBody = document.getElementById('coursesBody');
      try {
        const [enrolments, teachers, classrooms] = await Promise.all([
          apiGet('/api/v1/enrolments'),
          apiGet('/api/v1/teachers'),
          apiGet('/api/v1/classrooms'),
        ]);

        if (enrolments.length === 0) {
          coursesBody.innerHTML = '<tr><td colspan="5" class="text-muted">Not enrolled in any courses yet.</td></tr>';
          return;
        }

        const courses = await Promise.all(
          enrolments.map(e => apiGet(`/api/v1/courses/${encodeURIComponent(e.course_id_bus)}`))
        );

        lessonSources = enrolments
          .map((e, i) => ({ ...courses[i], status: e.status }))
          .filter(c => c.status === 'CONFIRMED');
        updateNextLesson();

        const teacherMap = Object.fromEntries(teachers.map(t => [t.teacher_id_bus, t]));
        const classroomMap = Object.fromEntries(classrooms.map(c => [c.classroom_id, c]));

        coursesBody.innerHTML = enrolments.map((enrolment, i) => {
          const course = courses[i];
          const teacher = teacherMap[course.teacher_id_bus];
          const classroom = classroomMap[course.classroom_id];
          const teacherName = teacher ? `${teacher.salutation} ${teacher.last_name}` : '—';
          const roomName = classroom ? classroom.room_name : '—';

          return `<tr>
            <td>${esc(course.course_name)}</td>
            <td>${esc(teacherName)}</td>
            <td>${esc(roomName)}</td>
            <td>${esc(course.schedule)}</td>
            <td><span class="badge ${{ CONFIRMED: 'bg-success', PENDING: 'bg-warning text-dark', CANCELLED: 'bg-danger' }[enrolment.status] || 'bg-secondary'}">${esc(enrolment.status)}</span></td>
          </tr>`;
        }).join('');
      } catch (err) {
        coursesBody.innerHTML = '<tr><td colspan="5" class="text-danger">Could not load courses. Please refresh.</td></tr>';
        console.error('Failed to load courses:', err);
      }
    }

    async function loadGrades() {
      const gradesBody = document.getElementById('gradesBody');
      try {
        const data = await apiGet('/api/v1/student/grades');
        const grades = data.grades || [];

        if (grades.length === 0) {
          gradesBody.innerHTML = '<tr><td colspan="5" class="text-muted">No grades recorded yet.</td></tr>';
          return;
        }

        gradesBody.innerHTML = grades.map(g => `<tr>
          <td>${esc(g.course && g.course.course_name)}</td>
          <td>${esc(g.assessment_name)}</td>
          <td>${g.score === null || g.score === undefined ? '—' : esc(g.score)}</td>
          <td>${esc(g.feedback) || '<span class="text-muted">—</span>'}</td>
          <td>${formatDate(g.graded_date)}</td>
        </tr>`).join('');
      } catch (err) {
        gradesBody.innerHTML = '<tr><td colspan="5" class="text-danger">Could not load grades. Please refresh.</td></tr>';
        console.error('Failed to load grades:', err);
      }
    }

    async function loadAttendance() {
      const attendanceBody = document.getElementById('attendanceBody');
      try {
        const records = await apiGet('/api/v1/student/attendance');

        if (records.length === 0) {
          attendanceBody.innerHTML = '<tr><td colspan="4" class="text-muted">No attendance recorded yet.</td></tr>';
          return;
        }

        attendanceBody.innerHTML = records.map(r => {
          const badge = ATTENDANCE_BADGE[r.status] || 'bg-secondary';
          const markedBy = r.teacher ? `${r.teacher.first_name} ${r.teacher.last_name}` : '—';
          return `<tr>
            <td>${formatDate(r.attendance_date)}</td>
            <td>${esc(r.course_name)}</td>
            <td><span class="badge ${badge}">${esc(r.status)}</span></td>
            <td>${esc(markedBy)}</td>
          </tr>`;
        }).join('');
      } catch (err) {
        attendanceBody.innerHTML = '<tr><td colspan="4" class="text-danger">Could not load attendance. Please refresh.</td></tr>';
        console.error('Failed to load attendance:', err);
      }
    }

    async function loadDashboard() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }

      if (me.user.role !== 'STUDENT') {
        window.location.href = 'login.html';
        return;
      }

      const student = me.student || {};
      document.getElementById('studentName').textContent =
        `${student.first_name || ''} ${student.last_name || ''}`.trim() || me.user.email;

      // The three sections load independently, so one failing doesn't blank the others.
      await Promise.all([loadCourses(), loadGrades(), loadAttendance()]);
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    loadDashboard();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Group Chat — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="#" id="brandLink">Education Management Platform</a>
    <span class="text-muted" id="navUser"></span>
  </nav>

  <div class="container my-3">
    <a href="#" id="backLink">Back to Group Chats</a>
  </div>

  <div class="container mb-5" style="max-width: 420px;">
    <h4 class="mb-4">Create Group Chat</h4>
    <p class="text-muted small mb-3">Participants are added automatically from the course's enrolment — the teacher and every enrolled student.</p>

    <!-- TODO (Week 8): wire to the group-creation endpoint; populate from courses without an existing group chat -->
    <form>
      <div class="mb-4">
        <label class="form-label">Course</label>
        <select class="form-select">
          <option>Math 101</option>
          <option>Math 201</option>
          <option>English 101</option>
          <option>Science 101</option>
        </select>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-fill">Confirm</button>
        <a href="#" id="cancelLink" class="btn btn-outline-secondary flex-fill">Cancel</a>
      </div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'admin';
    const myName = { admin: 'Admin', teacher: 'Mr. Lim' }[role] || 'Admin';

    document.getElementById('navUser').innerHTML = `${myName} (${role.charAt(0).toUpperCase() + role.slice(1)}) &nbsp;|&nbsp; <a href="login.html">Logout</a>`;
    document.getElementById('brandLink').href = role === 'teacher' ? 'teacher_dashboard.html' : 'admin_dashboard.html';
    document.getElementById('backLink').href = 'group_chats.html?role=' + role;
    document.getElementById('cancelLink').href = 'group_chats.html?role=' + role;
  </script>
</body>
</html>

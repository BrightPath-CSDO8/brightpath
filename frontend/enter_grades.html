<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter Grades — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      Mr. Lim (Teacher) &nbsp;|&nbsp; <a href="teacher_profile.html">My Profile</a> &nbsp;|&nbsp; <a href="messages.html?role=teacher">Messages</a> &nbsp;|&nbsp; <a href="login.html">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="#" id="backLink">Back to Class Roster</a>
  </div>

  <div class="container mb-4">
    <h4 class="mb-3" id="pageTitle">Enter Grades</h4>

    <div class="mb-3" style="max-width: 320px;">
      <label class="form-label">Assessment name</label>
      <input type="text" class="form-control" id="assessmentName" placeholder="e.g. Midterm">
    </div>

    <!-- TODO (Week 8): submit each row to the grades endpoint -->
    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th style="width: 25%;">Name</th>
          <th style="width: 15%;">Score</th>
          <th style="width: 60%;">Feedback</th>
        </tr>
      </thead>
      <tbody id="rosterBody"></tbody>
    </table>

    <button class="btn btn-primary mb-4" onclick="submitGrades()">Submit</button>
  </div>

  <script>
    // Demo-only lookup — same rosters already established elsewhere
    const rosters = {
      math101: { name: 'Math 101', students: ['Jane Tan', 'Alice Wong'] },
      math201: { name: 'Math 201', students: ['Alice Wong'] },
    };

    const params = new URLSearchParams(window.location.search);
    const key = params.get('course');
    const course = rosters[key] || rosters.math101;

    document.getElementById('pageTitle').textContent = `Enter Grades — ${course.name}`;
    document.getElementById('backLink').href = 'class_roster.html?course=' + key;

    const body = document.getElementById('rosterBody');
    course.students.forEach((name, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${name}</td>
        <td><input type="number" class="form-control form-control-sm" min="0" max="100" id="score_${i}"></td>
        <td><input type="text" class="form-control form-control-sm" id="feedback_${i}"></td>
      `;
      body.appendChild(tr);
    });

    function submitGrades() {
      const assessment = document.getElementById('assessmentName').value.trim();
      if (!assessment) {
        alert('Please enter an assessment name first.');
        return;
      }
      // TODO (Week 8): call the grades endpoint with { student, course, assessment, score, feedback } per row
      alert(`Grades for "${assessment}" (${course.name}) have been submitted.`);
    }
  </script>
</body>
</html>

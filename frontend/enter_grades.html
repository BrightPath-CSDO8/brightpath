<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter Grades — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="teacher_dashboard.html">Education Management Platform</a>
    <span class="text-muted">
      <span id="teacherName">Loading...</span> (Teacher) &nbsp;|&nbsp; <a href="teacher_profile.html">My Profile</a> &nbsp;|&nbsp; <a href="messages.html?role=teacher">Messages</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-4">

    <p><a id="backLink" href="teacher_dashboard.html">&larr; Back to roster</a></p>

    <h5 class="mb-3">Enter grades — <span id="courseName">Loading...</span></h5>

    <div id="formAlert" class="alert alert-danger" style="display: none;"></div>
    <div id="successAlert" class="alert alert-success" style="display: none;"></div>

    <form id="gradesForm">
      <div class="row mb-3" style="max-width: 600px;">
        <div class="col">
          <label class="form-label" for="assessmentName">Assessment name</label>
          <input type="text" class="form-control" id="assessmentName" placeholder="e.g. Midterm Assessment" required>
        </div>
        <div class="col">
          <label class="form-label" for="gradedDate">Date</label>
          <input type="date" class="form-control" id="gradedDate" required>
        </div>
      </div>

      <table class="table" style="table-layout: fixed; width: 100%;">
        <thead><tr>
          <th style="width: 25%;">Student</th>
          <th style="width: 15%;">Score (0–100)</th>
          <th style="width: 60%;">Feedback</th>
        </tr></thead>
        <tbody id="studentsBody">
          <tr><td colspan="3" class="text-muted">Loading roster...</td></tr>
        </tbody>
      </table>

      <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Submit grades</button>
    </form>

  </div>

  <script>
    const API_BASE = 'https://brightpath-backend-bagrbffzgjchfvek.malaysiawest-01.azurewebsites.net';
    const params = new URLSearchParams(window.location.search);
    const courseId = params.get('course');
    let roster = [];

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    function showFormAlert(message) {
      const alertEl = document.getElementById('formAlert');
      alertEl.textContent = message;
      alertEl.style.display = '';
    }

    function hideAlerts() {
      document.getElementById('formAlert').style.display = 'none';
      document.getElementById('successAlert').style.display = 'none';
    }

    async function init() {
      if (!courseId) {
        showFormAlert('Missing course parameter — go back to the dashboard and click a class.');
        return;
      }
      document.getElementById('backLink').href = `class_roster.html?course=${encodeURIComponent(courseId)}`;

      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }
      if (me.user.role !== 'TEACHER') {
        window.location.href = 'login.html';
        return;
      }
      const teacher = me.teacher || {};
      document.getElementById('teacherName').textContent =
        `${teacher.salutation || ''} ${teacher.last_name || ''}`.trim() || me.user.email;

      const dateInput = document.getElementById('gradedDate');
      dateInput.value = todayIso();
      dateInput.max = todayIso();

      const studentsBody = document.getElementById('studentsBody');
      try {
        const [courses, students] = await Promise.all([
          apiGet('/api/v1/teacher/courses'),
          apiGet(`/api/v1/teacher/${encodeURIComponent(courseId)}/students`),
        ]);

        const course = courses.find(c => c.course_id_bus === courseId);
        document.getElementById('courseName').textContent = course ? course.course_name : 'Unknown course';

        if (!course) {
          showFormAlert('You are not assigned to this course.');
          return;
        }

        roster = students;

        if (roster.length === 0) {
          studentsBody.innerHTML = '<tr><td colspan="3" class="text-muted">No confirmed students enrolled yet.</td></tr>';
          return;
        }

        studentsBody.innerHTML = roster.map(s => `<tr>
          <td>${esc(s.first_name)} ${esc(s.last_name)}</td>
          <td><input type="number" class="form-control" min="0" max="100" step="0.1" data-enrolment="${esc(s.enrolment_id_bus)}" data-field="score"></td>
          <td><input type="text" class="form-control" data-enrolment="${esc(s.enrolment_id_bus)}" data-field="feedback" placeholder="Optional feedback"></td>
        </tr>`).join('');

        document.getElementById('submitBtn').disabled = false;
      } catch (err) {
        showFormAlert('Could not load the class roster. Please refresh.');
        console.error('Failed to load roster:', err);
      }
    }

    document.getElementById('gradesForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideAlerts();

      const assessmentName = document.getElementById('assessmentName').value.trim();
      const gradedDate = document.getElementById('gradedDate').value;

      if (!assessmentName) {
        showFormAlert('Please enter an assessment name.');
        return;
      }
      if (!gradedDate) {
        showFormAlert('Please choose a date.');
        return;
      }
      if (gradedDate > todayIso()) {
        showFormAlert('Assessment date cannot be in the future.');
        return;
      }

      const scoreInputs = document.querySelectorAll('#studentsBody input[data-field="score"]');
      const studentsPayload = [];
      for (const input of scoreInputs) {
        const enrolmentId = input.getAttribute('data-enrolment');
        const scoreValue = input.value.trim();
        if (scoreValue === '') {
          continue;
        }
        const score = Number(scoreValue);
        if (isNaN(score) || score < 0 || score > 100) {
          showFormAlert('Scores must be numbers between 0 and 100.');
          return;
        }
        const feedbackInput = document.querySelector(`#studentsBody input[data-field="feedback"][data-enrolment="${CSS.escape(enrolmentId)}"]`);
        const feedback = feedbackInput && feedbackInput.value.trim() ? feedbackInput.value.trim() : null;
        studentsPayload.push({ enrolment_id_bus: enrolmentId, score: score, feedback: feedback });
      }

      if (studentsPayload.length === 0) {
        showFormAlert('Please enter a score for at least one student.');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const response = await fetch(`${API_BASE}/api/v1/teacher/${encodeURIComponent(courseId)}/grades`, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ graded_date: gradedDate, assessment_name: assessmentName, students: studentsPayload }),
        });

        const body = await response.json().catch(() => ({}));

        if (!response.ok) {
          if (body.details) {
            const messages = Object.entries(body.details).map(([field, msg]) => `${field}: ${msg}`);
            showFormAlert(messages.join(' | '));
          } else {
            showFormAlert(body.message || `Submission failed (${response.status}).`);
          }
          return;
        }

        const successAlert = document.getElementById('successAlert');
        successAlert.textContent = `Grades saved: ${body.created} added, ${body.updated} updated, ${body.total} total.`;
        successAlert.style.display = '';
      } catch (err) {
        showFormAlert('Network error — could not reach the server. Please try again.');
        console.error('Grades submission failed:', err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit grades';
      }
    });

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>

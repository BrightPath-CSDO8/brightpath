<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Email — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 340px;">
      <h4 class="mb-1">Forgot Email</h4>
      <p class="text-muted small mb-3">
        Enter the ID number associated with your account. The registered email address
        will be sent via SMS to your registered mobile number.
      </p>

      <!-- TODO (Week 8): wire this to the lookup endpoint (ID number -> trigger SMS with email) -->
      <form>
        <div class="mb-3">
          <label class="form-label">ID number</label>
          <input type="text" class="form-control" placeholder="NRIC / Passport number">
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary flex-fill">Send email via SMS</button>
          <a href="login.html" class="btn btn-outline-secondary flex-fill">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

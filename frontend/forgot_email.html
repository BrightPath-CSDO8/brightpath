<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Email — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="d-flex flex-column" style="min-height: 100vh;">
    <div class="container mt-3">
      <div class="alert alert-warning py-2 mb-0">
        <strong>Preview only</strong> — this page isn't connected to a backend yet. Nothing here is saved or real.
      </div>
    </div>

    <div class="container d-flex justify-content-center align-items-center flex-grow-1">
      <div class="card p-4 shadow-sm" style="width: 340px;">
        <h4 class="mb-1">Forgot Email</h4>
        <p class="text-muted small mb-3">
          Enter the mobile number associated with your account. The registered email
          address will be sent via SMS to that number.
        </p>

        <!-- TODO (Week 8): wire this to the lookup endpoint (mobile number -> trigger SMS with email) -->
        <form>
          <div class="mb-3">
            <label class="form-label">Mobile number</label>
            <input type="tel" class="form-control" placeholder="8 or 9 followed by 7 digits">
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary flex-fill">Send email via SMS</button>
            <a href="login.html" class="btn btn-outline-secondary flex-fill">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>

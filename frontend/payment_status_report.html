<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Status Summary — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      Admin (Administrator) &nbsp;|&nbsp; <a href="login.html">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="reports.html">Back to Reports</a>
  </div>

  <div class="container">
    <h4 class="mb-3">Payment Status Summary</h4>

    <!-- TODO (Week 8): computed live via COUNT grouped by course and payment_status
         from the Enrolment table — not separately stored anywhere -->
    <table class="table table-bordered align-middle" id="reportTable">
      <thead class="table-light">
        <tr>
          <th>Course name</th>
          <th>Enrolled</th>
          <th>Paid</th>
          <th>Unpaid</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const courses = [
      { name: 'Math 101', enrolled: 28, paid: 24 },
      { name: 'Math 201', enrolled: 22, paid: 19 },
      { name: 'English 101', enrolled: 25, paid: 21 },
      { name: 'Science 101', enrolled: 18, paid: 15 },
    ];

    const body = document.querySelector('#reportTable tbody');
    courses.forEach(c => {
      const unpaid = c.enrolled - c.paid;
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.name}</td>
        <td>${c.enrolled}</td>
        <td>${c.paid}</td>
        <td>${unpaid}</td>
      `;
      body.appendChild(tr);
    });
  </script>
</body>
</html>

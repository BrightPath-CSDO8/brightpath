<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Admins — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="adminName">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="admin_dashboard.html">&larr; Main menu</a>
  </div>

  <div class="container">
    <h4 class="mb-3">Manage Admins</h4>

    <table class="table table-bordered align-middle" id="adminTable">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="adminBody">
        <tr><td colspan="2" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>

    <div class="d-flex gap-2 mb-4">
      <a href="create_admin.html" class="btn btn-primary">Create account</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script>

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    function statusBadge(status) {
      const cls = status === 'ACTIVE' ? 'bg-success' : 'bg-secondary';
      return `<span class="badge ${cls}">${esc(status)}</span>`;
    }

    async function loadAdmins() {
      const adminBody = document.getElementById('adminBody');
      try {
        const admins = await apiGet('/api/v1/admins');

        if (admins.length === 0) {
          adminBody.innerHTML = '<tr><td colspan="2" class="text-muted">No admins yet.</td></tr>';
          return;
        }

        adminBody.innerHTML = admins.map(a => `<tr>
          <td>${esc(a.first_name)} ${esc(a.last_name)}</td>
          <td>${statusBadge(a.status)}</td>
        </tr>`).join('');
      } catch (err) {
        adminBody.innerHTML = '<tr><td colspan="2" class="text-danger">Could not load admins. Please refresh.</td></tr>';
        console.error('Failed to load admins:', err);
      }
    }

    async function init() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }
      if (me.user.role !== 'ADMIN') {
        window.location.href = 'login.html';
        return;
      }
      const admin = me.admin || {};
      document.getElementById('adminName').textContent =
        `${admin.first_name || ''} ${admin.last_name || ''}`.trim() || me.user.email;

      await loadAdmins();
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>

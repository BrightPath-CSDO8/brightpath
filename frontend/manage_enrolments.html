<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <title>Manage Enrolments — BrightPath</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>@media (max-width: 576px) { .table-responsive > .table { min-width: 720px; } }</style>
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 d-flex align-items-center text-decoration-none" href="admin_dashboard.html">
      <img src="assets/logo.png" alt="" height="34" class="me-2">
      <span class="fw-semibold">BrightPath</span>
    </a>
    <span class="text-muted">
      <span id="adminName">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="view_admin.html?admin=me">My Profile</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="admin_dashboard.html">&larr; Main menu</a>
  </div>

  <div class="container">
    <h4 class="mb-3">Enrolments</h4>

    <div id="formAlert" class="alert alert-danger" style="display: none;"></div>
    <div id="successAlert" class="alert alert-success" style="display: none;"></div>

    <ul class="nav nav-tabs mb-3" id="statusTabs">
      <li class="nav-item"><a class="nav-link active" href="#" data-status="">All</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-status="PENDING">Pending</a></li>
      <li class="nav-item"><a class="nav-link" href="#" data-status="CONFIRMED">Confirmed</a></li>
    </ul>

    <div class="mb-3" style="max-width: 380px;">
      <input type="search" class="form-control" id="tableFilter" placeholder="Search by student or course" aria-label="Search the list" autocomplete="off">
      <div class="form-text" id="filterInfo"></div>
    </div>

    <div class="table-responsive"><table class="table table-bordered align-middle" id="enrolmentTable">
      <thead class="table-light">
        <tr>
          <th>Student</th>
          <th>Course</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="enrolmentBody">
        <tr><td colspan="4" class="text-muted">Loading...</td></tr>
      </tbody>
    </table></div>
  </div>

  <script src="config.js"></script>
  <script>
    let currentStatus = '';

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    function showFormAlert(message) {
      const alertEl = document.getElementById('formAlert');
      alertEl.textContent = message;
      alertEl.style.display = '';
    }

    function hideAlerts() {
      document.getElementById('formAlert').style.display = 'none';
      document.getElementById('successAlert').style.display = 'none';
    }

    function statusBadge(status) {
      const cls = { CONFIRMED: 'bg-success', PENDING: 'bg-warning text-dark', CANCELLED: 'bg-danger' }[status] || 'bg-secondary';
      return `<span class="badge ${cls}">${esc(status)}</span>`;
    }

    async function loadEnrolments() {
      const enrolmentBody = document.getElementById('enrolmentBody');
      enrolmentBody.innerHTML = '<tr><td colspan="4" class="text-muted">Loading...</td></tr>';

      try {
        const path = currentStatus
          ? `/api/v1/auth/enrolments?status=${encodeURIComponent(currentStatus)}`
          : '/api/v1/auth/enrolments';
        const enrolments = await apiGet(path);

        if (enrolments.length === 0) {
          enrolmentBody.innerHTML = '<tr><td colspan="4" class="text-muted">No enrolments found.</td></tr>';
          return;
        }

        enrolmentBody.innerHTML = enrolments.map(e => `<tr>
          <td>${esc(e.first_name)} ${esc(e.last_name)}</td>
          <td>${esc(e.course_name)}</td>
          <td>${statusBadge(e.status)}</td>
          <td>
            ${e.status === 'PENDING'
              ? `<button class="btn btn-sm btn-primary" data-enrolment="${esc(e.enrolment_id_bus)}" data-course="${esc(e.course_name)}" data-student="${esc(e.first_name)} ${esc(e.last_name)}" onclick="confirmEnrolment(this)">Confirm</button>`
              : '<span class="text-muted small">—</span>'}
          </td>
        </tr>`).join('');
      } catch (err) {
        enrolmentBody.innerHTML = '<tr><td colspan="4" class="text-danger">Could not load enrolments. Please refresh.</td></tr>';
        console.error('Failed to load enrolments:', err);
      }
    }

    async function confirmEnrolment(button) {
      hideAlerts();
      const enrolmentId = button.getAttribute('data-enrolment');
      const courseName = button.getAttribute('data-course');
      const studentName = button.getAttribute('data-student');

      if (!confirm(`Confirm ${studentName}'s enrolment in ${courseName}?\n\nPlease check that payment has been received first.`)) {
        return;
      }

      button.disabled = true;
      button.textContent = 'Confirming...';

      try {
        const response = await fetch(`${API_BASE}/api/v1/enrolment/${encodeURIComponent(enrolmentId)}`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'CONFIRMED' }),
        });

        const body = await response.json().catch(() => ({}));

        if (!response.ok) {
          showFormAlert(body.message || `Could not confirm enrolment (${response.status}).`);
          button.disabled = false;
          button.textContent = 'Confirm';
          return;
        }

        const successAlert = document.getElementById('successAlert');
        successAlert.textContent = `${studentName}'s enrolment in ${courseName} confirmed.`;
        successAlert.style.display = '';

        await loadEnrolments();
      } catch (err) {
        showFormAlert('Network error — could not reach the server. Please try again.');
        console.error('Confirm enrolment failed:', err);
        button.disabled = false;
        button.textContent = 'Confirm';
      }
    }

    document.getElementById('statusTabs').addEventListener('click', function (e) {
      if (e.target.tagName !== 'A') return;
      e.preventDefault();
      currentStatus = e.target.getAttribute('data-status');
      document.querySelectorAll('#statusTabs .nav-link').forEach(a => a.classList.remove('active'));
      e.target.classList.add('active');
      hideAlerts();
      loadEnrolments();
    });

    async function init() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }
      if (me.user.role !== 'ADMIN') {
        window.location.href = 'login.html';
        return;
      }
      const admin = me.admin || {};
      document.getElementById('adminName').textContent =
        `${admin.first_name || ''} ${admin.last_name || ''}`.trim() || me.user.email;

      await loadEnrolments();
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    init();
  </script>
  <script>
    // Live search: hides table rows that don't contain the typed text.
    (function () {
      const input = document.getElementById('tableFilter');
      const info = document.getElementById('filterInfo');
      const tbody = document.getElementById('enrolmentBody');

      function rowText(tr) {
        // Dropdowns contribute only their selected value, not every option.
        const selected = [...tr.querySelectorAll('select')].map(s => s.value).join(' ');
        const clone = tr.cloneNode(true);
        clone.querySelectorAll('select').forEach(s => s.remove());
        return (clone.textContent + ' ' + selected).toLowerCase();
      }

      function applyFilter() {
        const q = input.value.trim().toLowerCase();
        // Rows with a colspan cell are messages (Loading..., No results), not data.
        const rows = [...tbody.querySelectorAll('tr')].filter(tr => !tr.querySelector('td[colspan]'));
        let shown = 0;
        rows.forEach(tr => {
          const match = !q || rowText(tr).includes(q);
          tr.classList.toggle('d-none', !match);
          if (match) shown++;
        });
        info.textContent = q ? `Showing ${shown} of ${rows.length}` : '';
      }

      input.addEventListener('input', applyFilter);
      // Re-apply after the table is (re)loaded or the enrolment tabs change.
      new MutationObserver(applyFilter).observe(tbody, { childList: true });
    })();
  </script>
</body>
</html>

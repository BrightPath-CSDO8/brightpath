<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Record Attendance — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      Mr. Lim (Teacher) &nbsp;|&nbsp; <a href="teacher_profile.html">My Profile</a> &nbsp;|&nbsp; <a href="messages.html?role=teacher">Messages</a> &nbsp;|&nbsp; <a href="login.html">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="#" id="backLink">Back to Class Roster</a>
  </div>

  <div class="container mb-4">
    <h4 class="mb-3" id="pageTitle">Record Attendance</h4>

    <div class="mb-3" style="max-width: 240px;">
      <label class="form-label">Date</label>
      <input type="date" class="form-control" id="attendanceDate">
    </div>

    <!-- TODO (Week 8): submit each row to the attendance-recording endpoint -->
    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="rosterBody"></tbody>
    </table>

    <button class="btn btn-primary mb-4" onclick="submitAttendance()">Submit</button>
  </div>

  <script>
    // Demo-only lookup — same rosters already established elsewhere
    const rosters = {
      math101: { name: 'Math 101', students: ['Jane Tan', 'Alice Wong'] },
      math201: { name: 'Math 201', students: ['Alice Wong'] },
    };

    const params = new URLSearchParams(window.location.search);
    const key = params.get('course');
    const course = rosters[key] || rosters.math101;

    document.getElementById('pageTitle').textContent = `Record Attendance — ${course.name}`;
    document.getElementById('backLink').href = 'class_roster.html?course=' + key;

    const body = document.getElementById('rosterBody');
    course.students.forEach(name => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${name}</td>
        <td>
          <select class="form-select form-select-sm">
            <option value="present" selected>Present</option>
            <option value="absent">Absent</option>
            <option value="late">Late</option>
          </select>
        </td>
      `;
      body.appendChild(tr);
    });

    function submitAttendance() {
      const date = document.getElementById('attendanceDate').value;
      if (!date) {
        alert('Please select a date first.');
        return;
      }
      // TODO (Week 8): call the attendance endpoint with { student, course, date, status } per row
      alert(`Attendance for ${course.name} on ${date} has been recorded.`);
    }
  </script>
</body>
</html>

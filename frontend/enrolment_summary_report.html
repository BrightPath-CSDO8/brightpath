<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enrolment Summary — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="navUser">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="login.html">Logout</a>
    </span>
  </nav>

  <script src="config.js"></script>
  <script src="navbar-identity.js"></script>

  <div class="container my-3">
    <a href="reports.html">Back to Reports</a>
  </div>

  <div class="container">
    <h4 class="mb-3">Enrolment Summary</h4>

    <!-- TODO (Week 8): computed live via COUNT grouped by course from the Enrolment table,
         joined against Course.capacity — not separately stored anywhere -->
    <table class="table table-bordered align-middle" id="reportTable">
      <thead class="table-light">
        <tr>
          <th>Course name</th>
          <th>Intake</th>
          <th>Capacity</th>
          <th>Enrolled</th>
          <th>% Filled</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const courses = [
      { name: 'Math 101', intake: '2026 Term 3', capacity: 30, enrolled: 28 },
      { name: 'Math 201', intake: '2026 Term 3', capacity: 25, enrolled: 22 },
      { name: 'English 101', intake: '2026 Term 3', capacity: 28, enrolled: 25 },
      { name: 'Science 101', intake: '2026 Term 3', capacity: 20, enrolled: 18 },
    ];

    const body = document.querySelector('#reportTable tbody');
    courses.forEach(c => {
      const pctFilled = Math.round((c.enrolled / c.capacity) * 100);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.name}</td>
        <td>${c.intake}</td>
        <td>${c.capacity}</td>
        <td>${c.enrolled}</td>
        <td>${pctFilled}%</td>
      `;
      body.appendChild(tr);
    });
  </script>
</body>
</html>

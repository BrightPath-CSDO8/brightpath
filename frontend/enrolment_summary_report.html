<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <title>Enrolment Summary — BrightPath</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>@media (max-width: 576px) { .table-responsive > .table { min-width: 720px; } }</style>
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 d-flex align-items-center text-decoration-none" href="admin_dashboard.html">
      <img src="assets/logo.png" alt="" height="34" class="me-2">
      <span class="fw-semibold">BrightPath</span>
    </a>
    <span class="text-muted">
      <span id="navUser">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="view_admin.html?admin=me">My Profile</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <script src="config.js"></script>
  <script src="navbar-identity.js"></script>

  <div class="container my-3">
    <a href="admin_dashboard.html">&larr; Main menu</a>
  </div>

  <div class="container mb-5">
    <h4 class="mb-1">Enrolment Summary</h4>
    <p class="text-muted small mb-3">Live from the database: confirmed enrolments vs. capacity for each course. "% filled" counts confirmed enrolments only.</p>

    <div id="formAlert" class="alert alert-danger" style="display: none;"></div>

    <div class="table-responsive"><table class="table table-bordered align-middle" id="reportTable">
      <thead class="table-light">
        <tr>
          <th>Course name</th>
          <th>Course status</th>
          <th>Starts</th>
          <th>Capacity</th>
          <th>Confirmed</th>
          <th>Pending</th>
          <th>% filled</th>
        </tr>
      </thead>
      <tbody id="reportBody">
        <tr><td colspan="7" class="text-muted">Loading...</td></tr>
      </tbody>
    </table></div>
    <div id="totals" class="text-muted small"></div>
  </div>

  <script>
    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    async function loadReport() {
      const body = document.getElementById('reportBody');
      try {
        const [courses, enrolments] = await Promise.all([
          apiGet('/api/v1/auth/courses'),
          apiGet('/api/v1/auth/enrolments'),
        ]);

        const confirmed = {};
        const pending = {};
        enrolments.forEach(e => {
          if (e.status === 'CONFIRMED') confirmed[e.course_id_bus] = (confirmed[e.course_id_bus] || 0) + 1;
          if (e.status === 'PENDING') pending[e.course_id_bus] = (pending[e.course_id_bus] || 0) + 1;
        });

        if (courses.length === 0) {
          body.innerHTML = '<tr><td colspan="7" class="text-muted">No courses yet.</td></tr>';
          return;
        }

        let totalCap = 0;
        let totalConfirmed = 0;
        body.innerHTML = courses.map(c => {
          const conf = confirmed[c.course_id_bus] || 0;
          const pend = pending[c.course_id_bus] || 0;
          const pct = c.capacity ? Math.round((conf / c.capacity) * 100) : 0;
          totalCap += c.capacity || 0;
          totalConfirmed += conf;
          return `<tr>
            <td>${esc(c.course_name)}</td>
            <td>${esc(c.status)}</td>
            <td>${esc(formatDate(c.start_date))}</td>
            <td>${esc(c.capacity)}</td>
            <td>${conf}</td>
            <td>${pend}</td>
            <td>${pct}%</td>
          </tr>`;
        }).join('');

        const overall = totalCap ? Math.round((totalConfirmed / totalCap) * 100) : 0;
        document.getElementById('totals').textContent =
          `${courses.length} courses · ${totalConfirmed} confirmed enrolments across ${totalCap} seats (${overall}% filled overall)`;
      } catch (err) {
        body.innerHTML = '';
        const alertEl = document.getElementById('formAlert');
        alertEl.textContent = 'Could not load the report. Please refresh.';
        alertEl.style.display = '';
        console.error('Failed to load report:', err);
      }
    }

    loadReport();
  </script>
</body>
</html>

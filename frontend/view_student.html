<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Details — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="navUser">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="view_admin.html?admin=me">My Profile</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <script src="config.js"></script>
  <script src="navbar-identity.js"></script>

  <div class="container my-3">
    <a href="manage_students.html">Back to Manage Students</a>
  </div>

  <div class="container mb-5" style="max-width: 640px;">
    <h4 class="mb-4" id="pageTitle">Student Details</h4>

    <!-- TODO (Week 8): wire to the student-update endpoint; load real record by student ID instead of the demo lookup below -->
    <form id="studentForm">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Full name</label>
          <input type="text" class="form-control" id="f_name" disabled>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">ID number</label>
          <input type="text" class="form-control" id="f_id" disabled>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Date of birth</label>
          <input type="date" class="form-control" id="f_dob" disabled>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Mobile number</label>
          <input type="tel" class="form-control" id="f_mobile" disabled>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea class="form-control" rows="2" id="f_address" disabled></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" id="f_email" disabled>
      </div>

      <div class="mb-4">
        <label class="form-label">Classes enrolled</label>
        <!-- Read-only always — enrolment changes happen via Manage Enrolments/Courses, not here -->
        <input type="text" class="form-control" id="f_classes" disabled>
      </div>

      <div class="mb-3 p-3 border rounded bg-light">
        <div class="fw-medium mb-1">Documents</div>
        <a href="documents.html" id="docLink">View / upload documents</a>
      </div>

      <!-- TODO (Week 8): wire to account credential endpoints -->
      <div class="mb-4 p-3 border rounded bg-light">
        <div class="fw-medium mb-1">Platform login credentials</div>
        <a href="manage_credentials.html" id="credLink">View, create, reset platform login credentials for user</a>
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary flex-fill" id="editBtn" onclick="enterEditMode()">Edit</button>
        <button type="submit" class="btn btn-primary flex-fill d-none" id="saveBtn">Save changes</button>
        <button type="button" class="btn btn-outline-secondary flex-fill d-none" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>

  <script>
    // Demo-only lookup standing in for a real API call by student ID (Week 8)
    const students = {
      jane: { name: 'Jane Tan', id: 'T0011223A', dob: '2008-03-14', mobile: '+65 9111 2222',
              address: '21 Bedok North Ave 2, Singapore', email: 'jane.tan@example.com',
              classes: 'Math 101, English 101' },
      bryan: { name: 'Bryan Ng', id: 'T0022334B', dob: '2007-11-02', mobile: '+65 9222 3333',
              address: '14 Clementi Ave 4, Singapore', email: 'bryan.ng@example.com',
              classes: 'English 101' },
      alice: { name: 'Alice Wong', id: 'T0033445C', dob: '2008-07-19', mobile: '+65 9333 4444',
              address: '9 Toa Payoh Lorong 3, Singapore', email: 'alice.wong@example.com',
              classes: 'Math 101, Math 201, Science 101' }
    };

    const params = new URLSearchParams(window.location.search);
    const key = params.get('student');
    const s = students[key] || students.jane; // fallback so the page still renders if opened directly

    const fieldIds = ['f_name', 'f_id', 'f_dob', 'f_mobile', 'f_address', 'f_email'];

    function loadValues() {
      document.getElementById('pageTitle').textContent = `Student Details — ${s.name}`;
      document.getElementById('f_name').value = s.name;
      document.getElementById('f_id').value = s.id;
      document.getElementById('f_dob').value = s.dob;
      document.getElementById('f_mobile').value = s.mobile;
      document.getElementById('f_address').value = s.address;
      document.getElementById('f_email').value = s.email;
      document.getElementById('f_classes').value = s.classes;
    }

    loadValues();
    document.getElementById('credLink').href = 'manage_credentials.html?name=' + encodeURIComponent(s.name);
    document.getElementById('docLink').href = 'documents.html?type=student&name=' + encodeURIComponent(s.name);

    function setFieldsDisabled(disabled) {
      fieldIds.forEach(id => document.getElementById(id).disabled = disabled);
      // f_classes stays disabled always — not part of the editable set
    }

    function enterEditMode() {
      setFieldsDisabled(false);
      document.getElementById('editBtn').classList.add('d-none');
      document.getElementById('saveBtn').classList.remove('d-none');
      document.getElementById('cancelBtn').classList.remove('d-none');
    }

    function exitEditMode() {
      setFieldsDisabled(true);
      document.getElementById('editBtn').classList.remove('d-none');
      document.getElementById('saveBtn').classList.add('d-none');
      document.getElementById('cancelBtn').classList.add('d-none');
    }

    function cancelEdit() {
      loadValues(); // discard any unsaved edits, revert to original values
      exitEditMode();
    }

    document.getElementById('studentForm').addEventListener('submit', function (e) {
      e.preventDefault();
      // TODO (Week 8): send updated field values to the student-update endpoint
      exitEditMode();
    });
  </script>
</body>
</html>

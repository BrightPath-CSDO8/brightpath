<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up for Student Account — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 420px;">
      <h4 class="mb-1">Sign Up for Student Account</h4>
      <p class="text-muted small mb-3">Self-service registration. All fields required.</p>

      <!-- TODO (Week 8): wire this form to the student self-registration endpoint -->
      <form>
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">ID number</label>
          <input type="text" class="form-control" placeholder="NRIC / Passport number">
          <!-- Used as the unique lookup key elsewhere (e.g. Forgot Email), since names aren't unique -->
        </div>
        <div class="mb-3">
          <label class="form-label">Date of birth</label>
          <input type="date" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Mobile number</label>
          <input type="tel" class="form-control" placeholder="+65 XXXX XXXX">
        </div>
        <div class="mb-3">
          <label class="form-label">Address</label>
          <textarea class="form-control" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" class="form-control" placeholder="name@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control">
        </div>

        <div class="d-flex gap-2 mt-4">
          <!-- TODO (Week 8): submit to registration endpoint, then redirect to login -->
          <button type="submit" class="btn btn-primary flex-fill">Confirm</button>
          <a href="login.html" class="btn btn-outline-secondary flex-fill">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

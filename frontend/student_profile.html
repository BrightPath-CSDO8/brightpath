<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="studentName">Loading...</span> (Student) &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="student_dashboard.html">&larr; Back to Dashboard</a>
  </div>

  <div class="container mb-5" style="max-width: 480px;">
    <h4 class="mb-4">My Profile</h4>

    <div id="formAlert" class="alert alert-danger" style="display: none;"></div>
    <div id="successAlert" class="alert alert-success" style="display: none;"></div>

    <form id="profileForm">
      <div class="mb-3">
        <label class="form-label">Full name</label>
        <input type="text" class="form-control" id="f_name" disabled>
      </div>

      <!-- ID number and Date of birth are read-only — official fields, changes go through Admin -->
      <div class="mb-3">
        <label class="form-label">ID number</label>
        <input type="text" class="form-control" id="f_id" disabled>
      </div>
      <div class="mb-3">
        <label class="form-label">Date of birth</label>
        <input type="text" class="form-control" id="f_dob" disabled>
      </div>

      <div class="mb-3">
        <label class="form-label">Mobile number</label>
        <input type="tel" class="form-control" id="f_mobile" placeholder="8 or 9 followed by 7 digits" disabled>
      </div>

      <!-- Email is the login identity — not editable here -->
      <div class="mb-4">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" id="f_email" disabled>
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary flex-fill" id="editBtn" onclick="enterEditMode()">Edit</button>
        <button type="submit" class="btn btn-primary flex-fill d-none" id="saveBtn">Save changes</button>
        <button type="button" class="btn btn-outline-secondary flex-fill d-none" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>

  <script>
    const API_BASE = 'https://brightpath-backend-bagrbffzgjchfvek.malaysiawest-01.azurewebsites.net';
    let student = null;
    let userEmail = '';

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    function showFormAlert(message) {
      const alertEl = document.getElementById('formAlert');
      alertEl.textContent = message;
      alertEl.style.display = '';
    }

    function hideAlerts() {
      document.getElementById('formAlert').style.display = 'none';
      document.getElementById('successAlert').style.display = 'none';
    }

    function loadValues() {
      document.getElementById('f_name').value = `${student.first_name} ${student.last_name}`;
      document.getElementById('f_id').value = student.student_id_bus;
      document.getElementById('f_dob').value = formatDate(student.dob);
      document.getElementById('f_mobile').value = student.mobile || '';
      document.getElementById('f_email').value = userEmail;
    }

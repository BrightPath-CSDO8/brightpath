<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Students — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="adminName">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="admin_dashboard.html">&larr; Main menu</a>
  </div>

  <div class="container text-center mb-4">
    <div class="card d-inline-block p-3 px-4">
      <div class="fs-5">Students</div>
      <div class="fs-4" id="studentCount">—</div>
    </div>
  </div>

  <div class="container">
    <table class="table table-bordered align-middle" id="studentTable">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>ID number</th>
          <th>Mobile number</th>
          <th>Date of birth</th>
          <th>Status</th>
          <th>Classes enrolled</th>
        </tr>
      </thead>
      <tbody id="studentBody">
        <tr><td colspan="6" class="text-muted">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="config.js"></script>
  <script>

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      if (isNaN(d)) return esc(iso);
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    function statusBadge(status) {
      const cls = status === 'ACTIVE' ? 'bg-success' : 'bg-secondary';
      return `<span class="badge ${cls}">${esc(status)}</span>`;
    }

    async function loadStudents() {
      const studentBody = document.getElementById('studentBody');
      try {
        const [students, enrolments] = await Promise.all([
          apiGet('/api/v1/students'),
          apiGet('/api/v1/auth/enrolments'),
        ]);

        document.getElementById('studentCount').textContent = students.length;

        const coursesByStudent = {};
        enrolments.forEach(e => {
          if (e.status === 'CONFIRMED') {
            if (!coursesByStudent[e.student_id_bus]) coursesByStudent[e.student_id_bus] = [];
            coursesByStudent[e.student_id_bus].push(e.course_name);
          }
        });

        if (students.length === 0) {
          studentBody.innerHTML = '<tr><td colspan="6" class="text-muted">No students yet.</td></tr>';
          return;
        }

        studentBody.innerHTML = students.map(s => {
          const classes = coursesByStudent[s.student_id_bus] || [];
          return `<tr>
            <td>${esc(s.first_name)} ${esc(s.last_name)}</td>
            <td>${esc(s.student_id_bus)}</td>
            <td>${esc(s.mobile) || '—'}</td>
            <td>${formatDate(s.dob)}</td>
            <td>${statusBadge(s.status)}</td>
            <td>${classes.length ? classes.map(esc).join(', ') : '<span class="text-muted">None</span>'}</td>
          </tr>`;
        }).join('');
      } catch (err) {
        studentBody.innerHTML = '<tr><td colspan="6" class="text-danger">Could not load students. Please refresh.</td></tr>';
        console.error('Failed to load students:', err);
      }
    }

    async function init() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }
      if (me.user.role !== 'ADMIN') {
        window.location.href = 'login.html';
        return;
      }
      const admin = me.admin || {};
      document.getElementById('adminName').textContent =
        `${admin.first_name || ''} ${admin.last_name || ''}`.trim() || me.user.email;

      await loadStudents();
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>

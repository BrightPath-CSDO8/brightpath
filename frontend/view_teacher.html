<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <title>Teacher Details — BrightPath</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 d-flex align-items-center text-decoration-none" href="admin_dashboard.html">
      <img src="assets/logo.png" alt="" height="34" class="me-2">
      <span class="fw-semibold">BrightPath</span>
    </a>
    <span class="text-muted">
      <span id="navUser">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="view_admin.html?admin=me">My Profile</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <script src="config.js"></script>
  <script src="navbar-identity.js"></script>

  <div class="container my-3">
    <a href="manage_teachers.html">Back to Manage Teachers</a>
  </div>

  <div class="container mb-5" style="max-width: 640px;">
    <h4 class="mb-4" id="pageTitle">Teacher Details</h4>

    <form id="teacherForm">
      <div id="formAlert" class="alert alert-danger" style="display: none;"></div>
      <div id="successAlert" class="alert alert-success" style="display: none;"></div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Teacher name</label>
          <input type="text" class="form-control" id="f_name" disabled>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">ID number</label>
          <input type="text" class="form-control" id="f_id" disabled>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Mobile number</label>
          <input type="tel" class="form-control" id="f_mobile" disabled>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Status</label>
          <select class="form-select" id="f_status" disabled>
            <option value="ACTIVE">ACTIVE</option>
            <option value="INACTIVE">INACTIVE</option>
          </select>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-primary flex-fill" id="editBtn" onclick="enterEditMode()">Edit</button>
        <button type="submit" class="btn btn-primary flex-fill d-none" id="saveBtn">Save changes</button>
        <button type="button" class="btn btn-outline-secondary flex-fill d-none" id="cancelBtn" onclick="cancelEdit()">Cancel</button>
      </div>
    </form>
  </div>

  <script>
    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    const params = new URLSearchParams(window.location.search);
    const teacherId = params.get('teacher');

    let teacher = null;
    const fieldIds = ['f_mobile', 'f_status'];

    function loadValues() {
      const fullName = `${teacher.salutation || ''} ${teacher.first_name} ${teacher.last_name}`.trim();
      document.getElementById('pageTitle').textContent = `Teacher Details — ${fullName}`;
      document.getElementById('f_name').value = fullName;
      document.getElementById('f_id').value = teacher.teacher_id_bus;
      document.getElementById('f_mobile').value = teacher.mobile || '';
      document.getElementById('f_status').value = teacher.status;
    }

    function setFieldsDisabled(disabled) {
      fieldIds.forEach(id => document.getElementById(id).disabled = disabled);
    }

    function enterEditMode() {
      setFieldsDisabled(false);
      document.getElementById('editBtn').classList.add('d-none');
      document.getElementById('saveBtn').classList.remove('d-none');
      document.getElementById('cancelBtn').classList.remove('d-none');
    }

    function exitEditMode() {
      setFieldsDisabled(true);
      document.getElementById('editBtn').classList.remove('d-none');
      document.getElementById('saveBtn').classList.add('d-none');
      document.getElementById('cancelBtn').classList.add('d-none');
    }

    function cancelEdit() {
      loadValues();
      exitEditMode();
    }

    function showFormAlert(message) {
      const alertEl = document.getElementById('formAlert');
      alertEl.textContent = message;
      alertEl.style.display = '';
    }

    function hideAlerts() {
      document.getElementById('formAlert').style.display = 'none';
      document.getElementById('successAlert').style.display = 'none';
    }

    document.getElementById('teacherForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      hideAlerts();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const newMobile = document.getElementById('f_mobile').value;
      const newStatus = document.getElementById('f_status').value;

      try {
        // The endpoint accepts partial updates; send only the two editable fields.
        const response = await fetch(`${API_BASE}/api/v1/teacher/${encodeURIComponent(teacherId)}`, {
          method: 'PATCH',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mobile: newMobile, status: newStatus }),
        });

        const body = await response.json().catch(() => ({}));

        if (!response.ok) {
          if (body.details) {
            showFormAlert(Object.values(body.details).join(' | '));
          } else {
            showFormAlert(body.message || `Update failed (${response.status}).`);
          }
          return;
        }

        teacher.mobile = newMobile;
        teacher.status = newStatus;
        const successAlert = document.getElementById('successAlert');
        successAlert.textContent = 'Teacher details updated.';
        successAlert.style.display = '';
        exitEditMode();
      } catch (err) {
        showFormAlert('Network error — could not reach the server. Please try again.');
        console.error('Teacher update failed:', err);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save changes';
      }
    });

    async function init() {
      if (!teacherId) {
        showFormAlert('No teacher specified.');
        return;
      }
      try {
        teacher = await apiGet(`/api/v1/teacher/${encodeURIComponent(teacherId)}`);
      } catch (err) {
        showFormAlert('Could not load teacher record.');
        console.error('Failed to load teacher:', err);
        return;
      }
      loadValues();
    }

    init();
  </script>
</body>
</html>

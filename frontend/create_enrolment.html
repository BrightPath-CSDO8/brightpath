<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Enrolment — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="navUser">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <script src="config.js"></script>
  <script src="navbar-identity.js"></script>

  <div class="container my-3">
    <a href="manage_enrolments.html">Back to Manage Enrolments</a>
  </div>

  <div class="container mb-5" style="max-width: 480px;">
    <h4 class="mb-4">Create Enrolment</h4>

    <!-- TODO (Week 8): wire to the enrolment-creation endpoint; populate both dropdowns from their real APIs -->
    <form>
      <div class="mb-3">
        <label class="form-label">Student</label>
        <select class="form-select">
          <option>Jane Tan</option>
          <option>Bryan Ng</option>
          <option>Alice Wong</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Course</label>
        <select class="form-select">
          <option>Math 101</option>
          <option>Math 201</option>
          <option>English 101</option>
          <option>Science 101</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label">Payment status</label>
        <select class="form-select">
          <option>Unpaid</option>
          <option>Paid</option>
        </select>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-fill">Confirm</button>
        <a href="manage_enrolments.html" class="btn btn-outline-secondary flex-fill">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>

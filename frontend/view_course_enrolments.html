<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Enrolments — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      <span id="navUser">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <script src="config.js"></script>
  <script src="navbar-identity.js"></script>

  <div class="container my-3">
    <a href="manage_enrolments.html">Back to Manage Enrolments</a>
  </div>

  <div class="container mb-4">
    <h4 class="mb-3" id="pageTitle">Enrolments</h4>

    <div class="row text-center g-3 mb-4" style="max-width: 500px;">
      <div class="col">
        <div class="card p-3"><div class="text-muted small">Current</div><div class="fs-4" id="statCurrent">–</div></div>
      </div>
      <div class="col">
        <div class="card p-3"><div class="text-muted small">Paid</div><div class="fs-4" id="statPaid">–</div></div>
      </div>
      <div class="col">
        <div class="card p-3"><div class="text-muted small">Unpaid</div><div class="fs-4" id="statUnpaid">–</div></div>
      </div>
    </div>

    <!-- TODO (Week 8): replace hardcoded roster with real data from the enrolments API;
         payment toggle wires to a simple status field, not a real payment gateway -->
    <table class="table table-bordered align-middle" id="rosterTable">
      <thead class="table-light">
        <tr>
          <th>Student name</th>
          <th>Email address</th>
          <th>Mobile number</th>
          <th>Payment status</th>
        </tr>
      </thead>
      <tbody id="rosterBody"></tbody>
    </table>

    <button class="btn btn-outline-danger" data-bs-toggle="modal" data-bs-target="#unenrollModal">Unenroll</button>
  </div>

  <!-- Unenroll modal -->
  <div class="modal fade" id="unenrollModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Unenroll Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Student</label>
            <select class="form-select" id="unenrollStudent"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Reason</label>
            <textarea class="form-control" rows="3" id="unenrollReason" placeholder="e.g. Payment not received after deadline"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" onclick="confirmUnenroll()">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Demo-only lookup standing in for a real API call by course ID (Week 8)
    // "key" matches the student records already defined in view_student.html
    const rosters = {
      math101: { name: 'Math 101', students: [
        { key: 'jane', name: 'Jane Tan', email: 'jane.tan@example.com', mobile: '+65 9111 2222', paid: true },
        { key: 'alice', name: 'Alice Wong', email: 'alice.wong@example.com', mobile: '+65 9333 4444', paid: false },
      ]},
      math201: { name: 'Math 201', students: [
        { key: 'alice', name: 'Alice Wong', email: 'alice.wong@example.com', mobile: '+65 9333 4444', paid: true },
      ]},
      english101: { name: 'English 101', students: [
        { key: 'jane', name: 'Jane Tan', email: 'jane.tan@example.com', mobile: '+65 9111 2222', paid: true },
        { key: 'bryan', name: 'Bryan Ng', email: 'bryan.ng@example.com', mobile: '+65 9222 3333', paid: false },
      ]},
      science101: { name: 'Science 101', students: [
        { key: 'alice', name: 'Alice Wong', email: 'alice.wong@example.com', mobile: '+65 9333 4444', paid: true },
      ]},
    };

    const params = new URLSearchParams(window.location.search);
    const key = params.get('course');
    const course = rosters[key] || rosters.math101; // fallback so the page still renders if opened directly

    document.getElementById('pageTitle').textContent = `Enrolments — ${course.name}`;

    function renderStats() {
      const total = course.students.length;
      const paid = course.students.filter(s => s.paid).length;
      document.getElementById('statCurrent').textContent = total;
      document.getElementById('statPaid').textContent = paid;
      document.getElementById('statUnpaid').textContent = total - paid;
    }

    function renderRoster() {
      const body = document.getElementById('rosterBody');
      body.innerHTML = '';
      course.students.forEach((s, i) => {
        const tr = document.createElement('tr');
        const statusBadge = s.paid
          ? '<span class="badge bg-success">Paid</span>'
          : '<span class="badge bg-warning text-dark">Unpaid</span>';
        // Paid status is read-only here — it reflects whether a matching Payment record exists.
        // The only way to mark someone Paid is to actually log a payment, so the two can't disagree.
        const action = s.paid
          ? ''
          : `<a href="create_payment.html?student=${encodeURIComponent(s.name)}&course=${encodeURIComponent(course.name)}" class="ms-2">Log Payment</a>`;
        tr.innerHTML = `
          <td><a href="view_student.html?student=${s.key}">${s.name}</a></td>
          <td>${s.email}</td>
          <td>${s.mobile}</td>
          <td>${statusBadge}${action}</td>
        `;
        body.appendChild(tr);
      });
      populateUnenrollDropdown();
    }

    function populateUnenrollDropdown() {
      const select = document.getElementById('unenrollStudent');
      select.innerHTML = course.students
        .map((s, i) => `<option value="${i}">${s.name}</option>`)
        .join('');
    }

    function confirmUnenroll() {
      const index = parseInt(document.getElementById('unenrollStudent').value, 10);
      const reason = document.getElementById('unenrollReason').value.trim();
      if (Number.isNaN(index) || !course.students.length) {
        alert('No student selected.');
        return;
      }
      if (!reason) {
        alert('Please enter a reason for unenrolling this student.');
        return;
      }
      // TODO (Week 8): call the unenrolment endpoint, passing student ID, course ID, and reason
      const removed = course.students.splice(index, 1)[0];
      renderStats();
      renderRoster();
      document.getElementById('unenrollReason').value = '';
      bootstrap.Modal.getInstance(document.getElementById('unenrollModal')).hide();
      alert(`${removed.name} has been unenrolled from ${course.name}.\nReason: ${reason}`);
    }

    renderStats();
    renderRoster();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

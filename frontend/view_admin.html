<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="admin_dashboard.html">Education Management Platform</a>
    <span class="text-muted">
      <span id="navName">Loading...</span> (Administrator) &nbsp;|&nbsp; <a href="view_admin.html?admin=me">My Profile</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="admin_dashboard.html">&larr; Main menu</a>
  </div>

  <div class="container mb-5" style="max-width: 480px;">
    <h4 class="mb-4">My Profile</h4>

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" class="form-control" id="f_name" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">Email address</label>
      <input type="email" class="form-control" id="f_email" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">Role</label>
      <input type="text" class="form-control" value="Administrator" disabled>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    async function init() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }
      if (me.user.role !== 'ADMIN') {
        window.location.href = 'login.html';
        return;
      }

      const admin = me.admin || {};
      const name = `${admin.first_name || ''} ${admin.last_name || ''}`.trim() || me.user.email;
      document.getElementById('navName').textContent = name;
      document.getElementById('f_name').value = name;
      document.getElementById('f_email').value = me.user.email;
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    init();
  </script>
</body>
</html>

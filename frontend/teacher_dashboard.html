<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teacher Dashboard — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="teacher_dashboard.html">Education Management Platform</a>
    <span class="text-muted">
      <span id="teacherName">Loading...</span> (Teacher) &nbsp;|&nbsp; <a href="teacher_profile.html">My Profile</a> &nbsp;|&nbsp; <a href="messages.html?role=teacher">Messages</a> &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>
    </span>
  </nav>

  <div class="container my-4">

    <div class="row text-center g-3 mb-4" style="max-width: 500px;">
      <div class="col">
        <div class="card p-3"><div class="text-muted small">Classes</div><div class="fs-4" id="classCount">—</div></div>
      </div>
      <div class="col">
        <div class="card p-3"><div class="text-muted small">Students</div><div class="fs-4" id="studentCount">—</div></div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-header">My assigned classes</div>
      <table class="table mb-0" style="table-layout: fixed; width: 100%;">
        <thead><tr>
          <th style="width: 25%;">Course</th>
          <th style="width: 15%;">Room</th>
          <th style="width: 30%;">Schedule</th>
          <th style="width: 15%;">Status</th>
          <th style="width: 15%;">Students</th>
        </tr></thead>
        <tbody id="classesBody">
          <tr><td colspan="5" class="text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <p class="text-muted small">Click a class above to view its roster, record attendance, or enter grades.</p>

  </div>

  <script src="config.js"></script>
  <script>

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    async function loadDashboard() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }

      if (me.user.role !== 'TEACHER') {
        window.location.href = 'login.html';
        return;
      }

      const teacher = me.teacher || {};
      document.getElementById('teacherName').textContent =
        `${teacher.salutation || ''} ${teacher.last_name || ''}`.trim() || me.user.email;

      const classesBody = document.getElementById('classesBody');

      try {
        const [courses, classrooms] = await Promise.all([
          apiGet('/api/v1/teacher/courses'),
          apiGet('/api/v1/classrooms'),
        ]);

        document.getElementById('classCount').textContent = courses.length;

        if (courses.length === 0) {
          classesBody.innerHTML = '<tr><td colspan="5" class="text-muted">No classes assigned yet.</td></tr>';
          document.getElementById('studentCount').textContent = 0;
          return;
        }

        const classroomMap = Object.fromEntries(classrooms.map(c => [c.classroom_id, c]));

        const rosters = await Promise.all(
          courses.map(c => apiGet(`/api/v1/teacher/${encodeURIComponent(c.course_id_bus)}/students`))
        );

        const totalStudents = rosters.reduce((sum, roster) => sum + roster.length, 0);
        document.getElementById('studentCount').textContent = totalStudents;

        classesBody.innerHTML = courses.map((course, i) => {
          const classroom = classroomMap[course.classroom_id];
          const roomName = classroom ? classroom.room_name : '—';
          return `<tr>
            <td><a href="class_roster.html?course=${encodeURIComponent(course.course_id_bus)}">${esc(course.course_name)}</a></td>
            <td>${esc(roomName)}</td>
            <td>${esc(course.schedule)}</td>
            <td><span class="badge bg-secondary">${esc(course.status)}</span></td>
            <td>${rosters[i].length}</td>
          </tr>`;
        }).join('');
      } catch (err) {
        classesBody.innerHTML = '<tr><td colspan="5" class="text-danger">Could not load classes. Please refresh.</td></tr>';
        console.error('Failed to load dashboard data:', err);
      }
    }

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      try {
        await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
      } catch (err) {
        console.error('Logout request failed:', err);
      }
      window.location.href = 'login.html';
    });

    loadDashboard();
  </script>
</body>
</html>

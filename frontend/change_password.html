<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="#" id="brandLink">Education Management Platform</a>
    <span class="text-muted" id="navUser">
      <a href="login.html">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="#" id="backLink">Back to My Profile</a>
  </div>

  <div class="container mb-5" style="max-width: 400px;">
    <h4 class="mb-4">Change Password</h4>

    <!-- Requires the current password since this is a self-service change by an already-logged-in
         user — different flow from Forgot Password, which is a token-based reset for someone locked out. -->
    <!-- TODO (Week 8): wire to the change-password endpoint; verify current password server-side -->
    <form>
      <div class="mb-3">
        <label class="form-label">Current password</label>
        <input type="password" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">New password</label>
        <input type="password" class="form-control">
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm new password</label>
        <input type="password" class="form-control">
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-fill">Confirm</button>
        <a href="#" id="cancelLink" class="btn btn-outline-secondary flex-fill">Cancel</a>
      </div>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role') || 'student'; // 'student' | 'teacher' | 'admin'
    const config = {
      student: { label: 'Jane Tan (Student)', profile: 'student_profile.html', dashboard: 'student_dashboard.html' },
      teacher: { label: 'Mr. Lim (Teacher)', profile: 'teacher_profile.html', dashboard: 'teacher_dashboard.html' },
      admin: { label: 'Admin (Administrator)', profile: 'view_admin.html?admin=admin', dashboard: 'admin_dashboard.html' },
    };
    const c = config[role] || config.student;

    document.getElementById('navUser').innerHTML = `${c.label} &nbsp;|&nbsp; <a href="login.html">Logout</a>`;
    document.getElementById('brandLink').href = c.dashboard;
    document.getElementById('backLink').href = c.profile;
    document.getElementById('cancelLink').href = c.profile;
  </script>
</body>
</html>

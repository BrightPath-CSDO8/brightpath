<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="#" id="brandLink">Education Management Platform</a>
    <span class="text-muted" id="navUser">
      <a href="login.html">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="#" id="backLink">Back to My Profile</a>
  </div>

  <div class="container mb-5" style="max-width: 400px;">
    <h4 class="mb-4">Change Password</h4>

    <!-- Requires the current password since this is a self-service change by an already-logged-in
         user — different flow from Forgot Password, which is a token-based reset for someone locked out. -->
    <!-- TODO (Week 8): wire to the change-password endpoint; verify current password server-side -->
    <form>
      <div class="mb-3">
        <label class="form-label">Current password</label>
        <input type="password" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">New password</label>
        <input type="password" class="form-control">
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm new password</label>
        <input type="password" class="form-control">
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-fill">Confirm</button>
        <a href="#" id="cancelLink" class="btn btn-outline-secondary flex-fill">Cancel</a>
      </div>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    let myName = '';

    async function apiGet(path) {
      const response = await fetch(`${API_BASE}${path}`, { credentials: 'include' });
      if (!response.ok) throw new Error(`${path} returned ${response.status}`);
      return response.json();
    }

    async function init() {
      let me;
      try {
        me = await apiGet('/api/v1/auth/me');
      } catch (err) {
        window.location.href = 'login.html';
        return;
      }

      const roleKey = (me.user.role || '').toLowerCase(); // 'admin' | 'teacher' | 'student'
      const roleLabels = { admin: 'Administrator', teacher: 'Teacher', student: 'Student' };
      const profileLinks = { admin: 'view_admin.html?admin=me', teacher: 'teacher_profile.html', student: 'student_profile.html' };
      const dashboardLinks = { admin: 'admin_dashboard.html', teacher: 'teacher_dashboard.html', student: 'student_dashboard.html' };

      if (roleKey === 'admin') {
        const admin = me.admin || {};
        myName = `${admin.first_name || ''} ${admin.last_name || ''}`.trim() || me.user.email;
      } else if (roleKey === 'teacher') {
        const teacher = me.teacher || {};
        myName = `${teacher.salutation || ''} ${teacher.last_name || ''}`.trim() || me.user.email;
      } else if (roleKey === 'student') {
        const student = me.student || {};
        myName = `${student.first_name || ''} ${student.last_name || ''}`.trim() || me.user.email;
      } else {
        myName = me.user.email;
      }

      const roleLabel = roleLabels[roleKey] || roleKey;
      const profileLink = profileLinks[roleKey] || 'login.html';
      const dashboardLink = dashboardLinks[roleKey] || 'login.html';

      document.getElementById('navUser').innerHTML = `${myName} (${roleLabel}) &nbsp;|&nbsp; <a href="#" id="logoutLink">Logout</a>`;
      document.getElementById('logoutLink').addEventListener('click', async function (e) {
        e.preventDefault();
        try {
          await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
        } catch (err) {
          console.error('Logout request failed:', err);
        }
        window.location.href = 'login.html';
      });
      document.getElementById('brandLink').href = dashboardLink;
      document.getElementById('backLink').href = profileLink;
      document.getElementById('cancelLink').href = profileLink;
    }

    init();
  </script>
</body>
</html>

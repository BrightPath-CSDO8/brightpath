<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Roster — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="teacher_dashboard.html">Education Management Platform</a>
    <span class="text-muted">
      Mr. Lim (Teacher) &nbsp;|&nbsp; <a href="teacher_profile.html">My Profile</a> &nbsp;|&nbsp; <a href="messages.html?role=teacher">Messages <span class="badge bg-danger">1</span></a> &nbsp;|&nbsp; <a href="login.html">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="teacher_dashboard.html">Back to Dashboard</a>
  </div>

  <div class="container mb-4">
    <h4 class="mb-3" id="pageTitle">Class Roster</h4>

    <!-- TODO (Week 8): replace hardcoded roster with real data from the enrolments API -->
    <table class="table table-bordered align-middle">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Email address</th>
          <th>Mobile number</th>
        </tr>
      </thead>
      <tbody id="rosterBody"></tbody>
    </table>

    <div class="d-flex gap-2 mb-4">
      <a href="#" id="attendanceLink" class="btn btn-primary">Record Attendance</a>
      <a href="#" id="gradesLink" class="btn btn-primary">Enter Grades</a>
    </div>
  </div>

  <script>
    // Demo-only lookup — same rosters already established on the admin side (view_course_enrolments.html)
    const rosters = {
      math101: { name: 'Math 101', students: [
        { key: 'jane', name: 'Jane Tan', email: 'jane.tan@example.com', mobile: '+65 9111 2222' },
        { key: 'alice', name: 'Alice Wong', email: 'alice.wong@example.com', mobile: '+65 9333 4444' },
      ]},
      math201: { name: 'Math 201', students: [
        { key: 'alice', name: 'Alice Wong', email: 'alice.wong@example.com', mobile: '+65 9333 4444' },
      ]},
    };

    const params = new URLSearchParams(window.location.search);
    const key = params.get('course');
    const course = rosters[key] || rosters.math101;

    document.getElementById('pageTitle').textContent = `Class Roster — ${course.name}`;
    document.getElementById('attendanceLink').href = 'record_attendance.html?course=' + key;
    document.getElementById('gradesLink').href = 'enter_grades.html?course=' + key;

    const body = document.getElementById('rosterBody');
    course.students.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><a href="student_contact.html?student=${s.key}&from=${key}">${s.name}</a></td><td>${s.email}</td><td>${s.mobile}</td>`;
      body.appendChild(tr);
    });
  </script>
</body>
</html>

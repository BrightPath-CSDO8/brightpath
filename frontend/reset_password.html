<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 340px;">
      <h4 class="mb-1">Reset Password</h4>
      <p class="text-muted small mb-3">
        Choose a new password for your account.
      </p>
      <!-- Reached via the time-limited link emailed from Forgot Password.
           TODO (Week 8): read the reset token from the URL, validate it (not expired/used) before showing this form -->

      <form>
        <div class="mb-3">
          <label class="form-label">New password</label>
          <input type="password" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm new password</label>
          <input type="password" class="form-control">
        </div>

        <!-- TODO (Week 8): submit to reset endpoint, invalidate the token after use, redirect to login -->
        <button type="submit" class="btn btn-primary w-100 mt-2">Reset Password</button>
      </form>
    </div>
  </div>
</body>
</html>

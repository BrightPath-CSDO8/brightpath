<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Archived Teachers — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      Admin (Administrator) &nbsp;|&nbsp; <a href="login.html">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="archives.html">Back to Archives</a>
  </div>

  <div class="container">
    <h4 class="mb-3">Archived Teachers</h4>

    <!-- TODO (Week 8): replace hardcoded rows with real archived teacher records from the API.
         Note: items archived on manage_teachers.html won't appear here yet — no shared
         backend to persist that action across pages until Week 8. -->
    <table class="table table-bordered align-middle" id="archiveTable">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Employment type</th>
          <th>Email address</th>
          <th>Contact number</th>
          <th>Archived on</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="archiveBody"></tbody>
    </table>
  </div>

  <script>
    let items = [
      { name: 'Ms. Tay', type: 'Part Time', email: 'tay@example.com', contact: '+65 9456 7890', date: '02 Aug 2026' },
      { name: 'Mr. Yusof', type: 'Full Time', email: 'yusof@example.com', contact: '+65 9567 8901', date: '10 Jul 2026' },
    ];

    function render() {
      const body = document.getElementById('archiveBody');
      body.innerHTML = items.length
        ? ''
        : '<tr><td colspan="6" class="text-muted text-center">No archived teachers.</td></tr>';
      items.forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.name}</td>
          <td>${item.type}</td>
          <td>${item.email}</td>
          <td>${item.contact}</td>
          <td>${item.date}</td>
          <td><button class="btn btn-sm btn-outline-secondary" onclick="restore(${i})">Restore</button></td>
        `;
        body.appendChild(tr);
      });
    }

    function restore(index) {
      // TODO (Week 8): call the restore endpoint (sets teacher record back to active)
      const item = items[index];
      items.splice(index, 1);
      render();
      alert(`${item.name} restored to Manage Teachers.`);
    }

    render();
  </script>
</body>
</html>

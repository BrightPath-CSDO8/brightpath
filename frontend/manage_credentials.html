<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Platform Login Credentials — Education Management Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-light bg-light border-bottom px-3">
    <span class="navbar-brand mb-0 h1">Education Management Platform</span>
    <span class="text-muted">
      Admin (Administrator) &nbsp;|&nbsp; <a href="login.html">Logout</a>
    </span>
  </nav>

  <div class="container my-3">
    <a href="#" onclick="history.back(); return false;">Back</a>
  </div>

  <div class="container mb-5" style="max-width: 480px;">
    <h4 class="mb-1" id="pageTitle">Platform Login Credentials</h4>
    <p class="text-muted small mb-4" id="userLabel"></p>

    <div class="card p-3 mb-4">
      <div class="text-muted small mb-1">Status</div>
      <div id="statusText" class="fw-medium"></div>
    </div>

    <div class="d-flex flex-column gap-2">
      <!-- TODO (Week 8): wire each action to its real endpoint -->
      <button class="btn btn-primary d-none" id="createBtn" onclick="createAccount()">Create new email address</button>
      <button class="btn btn-outline-primary d-none" id="resetBtn" onclick="resetPassword()">Reset password</button>
      <button class="btn btn-outline-danger d-none" id="deleteBtn" onclick="deleteAccount()">Delete email account</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || 'this user';
    document.getElementById('userLabel').textContent = `For: ${name}`;

    // Demo-only state — starts as "account exists" since this is reached from an existing teacher's page.
    // TODO (Week 8): replace with a real check against the Users/Auth table for this teacher.
    let hasAccount = true;
    let platformEmail = `${name}@school.edu`;

    function render() {
      const statusEl = document.getElementById('statusText');
      const createBtn = document.getElementById('createBtn');
      const resetBtn = document.getElementById('resetBtn');
      const deleteBtn = document.getElementById('deleteBtn');

      if (hasAccount) {
        statusEl.textContent = `Active — ${platformEmail}`;
        createBtn.classList.add('d-none');
        resetBtn.classList.remove('d-none');
        deleteBtn.classList.remove('d-none');
      } else {
        statusEl.textContent = 'No platform account created yet.';
        createBtn.classList.remove('d-none');
        resetBtn.classList.add('d-none');
        deleteBtn.classList.add('d-none');
      }
    }

    function createAccount() {
      // TODO (Week 8): call the account-creation endpoint, generating/assigning a real platform email
      hasAccount = true;
      render();
      alert(`Platform account created: ${platformEmail}\nA temporary password has been sent to their personal email on file.`);
    }

    function resetPassword() {
      // TODO (Week 8): call the password-reset endpoint (same mechanism as the Forgot Password flow)
      alert(`A password reset link has been sent to ${platformEmail}.`);
    }

    function deleteAccount() {
      // TODO (Week 8): call the account-deletion endpoint
      if (confirm(`Delete the platform account ${platformEmail}? This cannot be undone.`)) {
        hasAccount = false;
        render();
      }
    }

    render();
  </script>
</body>
</html>
